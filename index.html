<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123456">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Logbook</title>
<style>
/* Layout: tek sütun, üstte başlık, altta sabit sekme çubuğu */
:root{
  --bg:#f2f4f7; --card:#ffffff; --fg:#14202e; --mute:#5d6b7c; --line:#dde3ea;
  --accent:#123456; --accent-fg:#ffffff; --amber:#c98a12; --red:#b3261e; --chip:#e6edf5;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c131b; --card:#151f2b; --fg:#e6edf5; --mute:#8b9aab; --line:#253344;
  --accent:#4f8fd6; --accent-fg:#0c131b; --amber:#f0b43c; --red:#ff7b72; --chip:#1d2b3a;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--sans);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-fg);
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.02em}
header button{background:transparent;border:0;color:inherit;font-size:15px;padding:6px 4px}
#sync{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font:600 12px var(--sans);white-space:nowrap}
#sync.err{background:var(--red);color:#fff}
main{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(84px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;color:var(--mute);padding:10px 0 12px;font:600 11px var(--sans);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button.on{color:var(--accent)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;
  width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:16px}
.meta{color:var(--mute);font-size:13px;margin:8px 2px}
.list{display:flex;flex-direction:column;background:var(--card);border-radius:12px;border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .route{font:700 16px var(--mono);letter-spacing:.03em}
.route.rt{display:flex;align-items:flex-start;gap:8px}
.rt .st{display:flex;flex-direction:column;line-height:1.15}
.rt .st small{font:500 12px var(--mono);color:var(--mute);letter-spacing:0}
.rt .ar{color:var(--mute)}
.badges{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.ndot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:block}
.prow{grid-template-columns:44px minmax(0,1fr) auto}
.prow .av{grid-row:span 2;align-self:center}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:center 20%;background:var(--chip);display:flex;align-items:center;justify-content:center;font:700 15px var(--sans);color:var(--mute)}
.phead{display:flex;gap:14px;align-items:center;margin-bottom:4px}
.phead img{width:96px;height:120px;border-radius:12px;object-fit:cover;background:var(--chip);flex:none}
.phead .pn{display:flex;flex-direction:column;gap:6px;min-width:0}
.phead b{font-size:18px}
a.btn{display:inline-block;text-align:center;text-decoration:none}
.scanbar{display:flex;gap:10px;align-items:center}
.mtile{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.mright{display:flex;flex-direction:column;gap:8px;align-items:flex-end;min-width:0}
.mxl{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.mx{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:2px 4px 2px 9px;font-size:13px}
.mx b{font:700 13px var(--mono)}.mx small{color:var(--mute);font-size:11px}
.mx button{border:0;background:transparent;color:var(--mute);font-size:16px;line-height:1;width:24px;height:24px;border-radius:50%;cursor:pointer}
.mx button:hover{background:var(--line);color:var(--fg)}
.mxadd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mxadd input{width:68px;padding:7px 8px;font:15px var(--mono);text-align:center;min-height:36px}
.mxseg{grid-template-columns:1fr 1fr}.mxseg button{padding:7px 10px;font-size:13px}
.mxadd .btn{padding:8px 12px;font-size:14px}
.crewin{position:relative;display:block}
.crewin input{padding-left:48px}
.cav{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:var(--chip);overflow:hidden;display:flex;align-items:center;justify-content:center;font:700 12px var(--sans);color:var(--mute);text-transform:none;letter-spacing:0;z-index:1;cursor:pointer;border:0;padding:0}
.cav:focus-visible{outline:2px solid var(--accent)}
.cav img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.cav.empty{display:none}
.crewin.noav input{padding-left:10px}
.scanbar .btn{flex:1}
.row .blk{font:700 16px var(--mono);text-align:right}
.row .sub{color:var(--mute);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--chip);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--fg)}
.chip.sim{background:var(--accent);color:var(--accent-fg)}
.chip.cpt{background:var(--amber);color:#1b1300}
.more{display:block;width:100%;margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--accent);font-weight:600;font-size:15px}
.big{background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:16px;margin-bottom:12px}
.big .l{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.big .v{font:700 34px var(--mono)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .l{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font:700 22px var(--mono);margin-top:2px}
.tile .s{font-size:12px;color:var(--mute)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:18px 2px 8px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
form{display:flex;flex-direction:column;gap:12px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:44px;text-align:left}
input::-webkit-date-and-time-value{text-align:left;margin:0}
select{-webkit-appearance:none;appearance:none;min-height:44px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.ac{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.acl{position:absolute;left:0;right:0;top:100%;z-index:20;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:260px;overflow-y:auto;text-transform:none;letter-spacing:0}
.acl div{padding:10px 12px;font-size:15px;color:var(--fg);cursor:pointer;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.acl div{white-space:nowrap}.acl div>span{flex:none}.acl small{flex:1 1 auto}
.acl div:last-child{border-bottom:0}
.acl div:hover,.acl div.on{background:var(--chip)}
.acl small{color:var(--mute);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.city{font-size:12px;color:var(--mute);text-transform:none;letter-spacing:0;min-height:16px}
.mask{letter-spacing:.15em;color:var(--mute)}
span.nosim,span.onlysim,#simreg{display:flex;flex-direction:column;min-width:0}
.pfbox{flex-direction:row;align-items:center;gap:12px;font-size:15px;color:var(--fg);text-transform:none;letter-spacing:0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.pfbox input{width:24px;height:24px;flex:none}
.pinov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.pinbox{background:var(--card);color:var(--fg);border-radius:16px;padding:20px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;text-align:center}
.pinbox b{font-size:17px}.pinbox .meta{margin:0}
#pinin{font:700 30px var(--mono);letter-spacing:.6em;text-align:center;padding:12px 0 12px .6em}
.pinbtns{display:flex;justify-content:center}
#hdrAct{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font:600 12px var(--sans);white-space:nowrap}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;min-width:0}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);font:16px var(--sans);min-width:0}
input.code{font-family:var(--mono);text-transform:uppercase}
textarea{min-height:90px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg3{grid-template-columns:1fr 1fr 1fr}
.seg button{border:0;background:var(--card);color:var(--fg);padding:11px;font:600 15px var(--sans)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.check{flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--fg);text-transform:none;letter-spacing:0}
.check input{width:22px;height:22px}
.blkout{font:700 22px var(--mono);padding:8px 0}
.btn{padding:13px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-fg);font:700 16px var(--sans)}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--red);border:1px solid var(--red)}
.btn.danger.arm{background:var(--red);color:#fff}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.note b{display:block;margin-bottom:4px}
.note p{margin:0;white-space:pre-wrap;color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card p{margin:0 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><button id="back" hidden aria-label="Geri">‹ Geri</button><h1 id="ttl">Logbook</h1><button id="sync" hidden aria-label="Senkronizasyon durumu"></button><button id="hdrAct" hidden></button></header>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Uçuş ekle">+</button>
<nav>
  <button data-v="list" class="on"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Uçuşlar</button>
  <button data-v="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Özet</button>
  <button data-v="pilots"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>Pilotlar</button>
  <button data-v="planes"><svg viewBox="0 0 24 24"><path d="M12 3c.8 0 1.3.7 1.3 1.6V9l7.2 4.2v1.9l-7.2-2.2v4.6l2.2 1.7V21L12 20l-3.5 1v-1.8l2.2-1.7v-4.6l-7.2 2.2v-1.9L10.7 9V4.6C10.7 3.7 11.2 3 12 3z"/></svg>Uçaklar</button>
  <button data-v="notes"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Meydanlar</button>
  <button data-v="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ayarlar</button>
</nav>
<div class="toast" id="toast"></div>
<datalist id="dlAc"></datalist><datalist id="dlReg"></datalist><datalist id="dlPil"></datalist><datalist id="dlApt"></datalist>

<script>
/* ---------- Depolama (IndexedDB) ---------- */
const DBN='logbook', ST='kv';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbGet(k){const db=await idb();return new Promise(res=>{const q=db.transaction(ST).objectStore(ST).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}
async function dbPut(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(ST,'readwrite');t.objectStore(ST).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

let flights=[], notes=[], pilots=[], settings=[], planes=[];
async function load(){flights=(await dbGet('flights'))||[];notes=(await dbGet('notes'))||[];pilots=(await dbGet('pilots'))||[];settings=(await dbGet('settings'))||[];planes=(await dbGet('planes'))||[];
  sync=(await dbGet('sync'))||null;pending=(await dbGet('pending'))||{};
  flights.forEach(normF);sortF();if(flights.length&&(await dbGet('fmt'))!==2){await saveData();await dbPut('fmt',2)}
  if(cleanupDupes())await saveData()}
/* PDF'ten gelen kopyalar: aynı gün, aynı kalkış meydanı ve off-block saatinde Excel'den gelen bir kayıt varsa PDF kopyası silinir.
   Simülatörde aynı gün başka bir simülatör kaydı varsa PDF kopyası silinir. PDF'ten eklenen pilotlardan Excel'de aynı ismi olanlar da silinir (notu ve sicili boşsa). */
function cleanupDupes(){
  let n=0;const key=f=>f.sim?f.date+'|SIM':f.date+'|'+f.dep+'|'+f.off;
  const other=new Set(flights.filter(f=>!String(f.id).startsWith('pdf-')).map(key));
  const drop=new Set(flights.filter(f=>String(f.id).startsWith('pdf-')&&other.has(key(f))).map(f=>f.id));
  if(drop.size){flights=flights.filter(f=>!drop.has(f.id));drop.forEach(id=>mark('f',id));n+=drop.size}
  const realNames=new Set(pilots.filter(p=>!String(p.id).startsWith('pdfp')).map(p=>fold(p.name)));
  const pdrop=new Set(pilots.filter(p=>String(p.id).startsWith('pdfp')&&!p.note&&!p.sicil&&realNames.has(fold(p.name))).map(p=>p.id));
  if(pdrop.size){pilots=pilots.filter(p=>!pdrop.has(p.id));pdrop.forEach(id=>mark('p',id));n+=pdrop.size}
  return n}
async function saveData(){await dbPut('flights',flights);await dbPut('notes',notes);await dbPut('pilots',pilots);await dbPut('settings',settings);await dbPut('planes',planes);await dbPut('pending',pending)}
async function save(){await saveData();if(sync&&Object.keys(pending).length)scheduleSync()}

/* ---------- Senkronizasyon (Google E-Tablolar üzerinden) ----------
   Her cihaz kayıtların tamamını kendinde tutar (çevrimdışı çalışır).
   Değişen her kayıt "bekleyen" listesine girer; internet olunca Google'a gider,
   diğer cihazların değişiklikleri de oradan alınır. Çakışmada en son düzenleme kazanır. */
let sync=null, pending={}, syncing=false, syncAgain=false, syncState='off', syncMsg='', syncTimer=null;
const KINDS={f:()=>flights,p:()=>pilots,n:()=>notes,s:()=>settings,a:()=>planes};
function setArr(k,a){if(k==='f')flights=a;else if(k==='p')pilots=a;else if(k==='s')settings=a;else if(k==='a')planes=a;else notes=a}
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function mark(k,id,rec){const t=Date.now();if(rec)rec.u=t;if(sync)pending[k+':'+id]=t}
const pendCount=()=>Object.keys(pending).length;
function setSync(st,msg){syncState=st;syncMsg=msg||'';const b=$('#sync');if(!b)return;b.hidden=!sync;b.classList.toggle('err',st==='err');
  const n=pendCount();
  b.textContent=st==='busy'?'↻ Eşitleniyor':st==='offline'?(n?`Çevrimdışı · ${n}`:'Çevrimdışı'):st==='err'?'! Senkron':n?`↑ ${n}`:'✓ Senkron';
  const s=$('#syncStatus');if(s)s.textContent=syncText()}
function syncText(){if(!sync)return '';const n=pendCount();
  const last=sync.last?new Date(sync.last).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'henüz yok';
  if(syncState==='busy')return syncMsg||'Eşitleniyor…';
  if(syncState==='err')return 'Hata: '+syncMsg+(n?` · ${n} değişiklik bekliyor`:'');
  if(syncState==='offline')return 'İnternet yok. '+(n?`${n} değişiklik internet gelince gönderilecek.`:'Değişiklikler internet gelince gönderilecek.');
  return `Son eşitleme: ${last}`+(n?` · ${n} değişiklik bekliyor`:' · her şey güncel')}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>runSync(),1500)}
async function callSync(body){
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),120000);
  try{
    let r;try{r=await fetch(sync.url,{method:'POST',body:JSON.stringify({key:sync.key,...body}),headers:{'Content-Type':'text/plain;charset=utf-8'},signal:ctl.signal})}
    catch(e){const x=new Error('İnternet bağlantısı yok ya da zayıf');x.net=true;throw x}
    let j;try{j=await r.json()}catch{throw new Error('Google tablosundan beklenmeyen cevap geldi')}
    if(!j.ok)throw new Error(j.error==='key'?'Kurulum kodu Google tablosundaki şifreyle uyuşmuyor':'Google tablosu hata verdi');
    return j}
  finally{clearTimeout(to)}}
function buildChanges(limit){
  const maps={};for(const k in KINDS)maps[k]=new Map(KINDS[k]().map(r=>[r.id,r]));
  const out=[];for(const key of Object.keys(pending)){if(out.length>=limit)break;
    const i=key.indexOf(':'),k=key.slice(0,i),id=key.slice(i+1);if(!KINDS[k]){delete pending[key];continue}
    const rec=maps[k].get(id);if(rec&&!rec.u)rec.u=pending[key]||1;
    out.push(rec?{id:key,kind:k,updated:rec.u||pending[key],deleted:false,data:rec}:{id:key,kind:k,updated:pending[key],deleted:true})}
  return out}
function applyRemote(changes){
  let n=0;const idx={},del={};for(const k in KINDS){idx[k]=new Map(KINDS[k]().map((r,i)=>[r.id,i]));del[k]=new Set()}
  for(const c of changes||[]){
    const i=String(c.id).indexOf(':');if(i<1)continue;const k=c.id.slice(0,i),id=c.id.slice(i+1);if(!KINDS[k])continue;
    const arr=KINDS[k](), at=idx[k].get(id), loc=at!=null&&!del[k].has(id)?arr[at]:null, pt=pending[c.id];

async function runSync(){

  try{
    if(!sync.since){ /* bu cihazın ilk bağlantısı: önce buluttakini al, bulutta olmayanları gönder */
      setSync('busy','Buluttaki kayıtlar alınıyor…');
      const j=await callSync({since:0,changes:[]});
      const remote=new Map(j.changes.map(c=>[c.id,c.updated]));
      for(const k in KINDS)for(const r of KINDS[k]()){const key=k+':'+r.id;
        if(!remote.has(key)||(r.u||0)>remote.get(key))pending[key]=pending[key]||r.u||1}
      got+=applyRemote(j.changes);sync.since=j.server;await dbPut('sync',sync);await saveData();if(got)refresh()}
    let loops=0;

      if(batch.length)setSync('busy',`${pendCount().toLocaleString('tr-TR')} kayıt gönderiliyor…`);

      for(const [id,t] of snap)if(pending[id]===t)delete pending[id];
      sent+=batch.length;const n=applyRemote(j.changes);got+=n;
      sync.since=j.server;sync.last=Date.now();await dbPut('sync',sync);
      if(n){await saveData();refresh()}else await dbPut('pending',pending);

/* ---------- Uçuş listesi ---------- */
function matches(f,q){return fold([f.date,trDate(f.date),f.flt,f.dep,f.arr,city(f.dep),city(f.arr),f.ac,f.reg,f.p1,f.p2,f.p3,f.p4,f.js,f.ins,f.rem,f.sim?'sim':''].join(' ')).includes(q)}
function renderList(){
  setHeader('Logbook');
  if(!flights.length){main.innerHTML=`<div class="empty"><p><b>Henüz uçuş yok.</b></p><p>Excel'den aktardığın kayıtları yüklemek için <b>Ayarlar → Yedek dosyasını yükle</b>'ye git, ya da + ile ilk uçuşunu ekle.</p></div>`;return}
  main.innerHTML=`<input class="search" id="q" type="search" placeholder="Ara" value="${esc(query)}"><div class="meta" id="cnt"></div><div class="list" id="lst"></div><button class="more" id="more" hidden>Daha fazla göster</button>`;
  const q=$('#q');q.oninput=()=>{query=q.value;shown=60;drawRows()};
  $('#more').onclick=()=>{shown+=100;drawRows()};
  drawRows();
}
function drawRows(){
  const q=fold(query), rows=q?flights.filter(f=>matches(f,q)):flights;
  const sum=rows.reduce((s,f)=>s+(f.blk||0),0), ns=rows.filter(f=>f.sim).length;
  $('#cnt').innerHTML=`${(rows.length-ns).toLocaleString('tr-TR')} uçuş · <span class="num">${hm(sum)}</span> saat${ns?` · ${ns} simülatör`:''}`;
  $('#lst').innerHTML=rows.slice(0,shown).map(f=>`<div class="row" data-id="${f.id}">
    <div class="route rt"><span class="st">${esc(f.dep||'---')}<small>${esc(f.off||'')}</small></span><span class="ar">→</span><span class="st">${esc(f.arr||'---')}<small>${esc(f.on||'')}</small></span></div><div class="blk">${hm(f.sim?f.simt:f.blk)}</div>
    <div class="sub">${[trDate(f.date),esc(f.flt),[esc(f.ac),esc(f.reg)].filter(Boolean).join(' ')].filter(Boolean).join(' · ')}</div>
    <div class="badges">${f.sim?'<span class="chip sim">SIM</span>':f.pf==='SELF'?'<span class="chip cpt">PF</span>':''}${f.rem&&f.rem.trim()?'<span class="ndot" title="Bu uçuşta not var"></span>':''}</div></div>`).join('')||'<div class="empty">Sonuç yok</div>';
  $('#more').hidden=rows.length<=shown;
  document.querySelectorAll('#lst .row').forEach(r=>r.onclick=()=>nav({v:'editFlight',id:r.dataset.id}));
}

/* ---------- Uçuş ekle / düzenle ---------- */

      if(r.date){set('date',r.date);got.push('tarih')}if(r.flt){set('flt',r.flt);got.push('sefer no')}

      if(r.dep||r.arr)['dep','arr'].forEach(k=>{$('#c_'+k).textContent=city($('#f_'+k).value)});upd();

      if(!p)continue;pid[s]=p.id;

    if(added||photoN){toast('Kaydedildi'+(added?' · '+added+' yeni pilot eklendi':'')+(photoN?' · '+photoN+' fotoğraf güncellendi':''));back();return}

/* ---------- Özet ---------- */
function renderStats(){
  setHeader('Özet');
  const sum=(arr)=>arr.reduce((s,f)=>s+(f.blk||0),0);
  const sims=flights.filter(f=>f.sim), real=flights.filter(f=>!f.sim), simT=sims.reduce((s,f)=>s+(f.simt||0),0);
  const since=d=>real.filter(f=>f.date>=d);
  const tot=sum(flights), cpt=sum(flights.filter(f=>f.role==='CPT')), fo=tot-cpt;
  const y=new Date().getFullYear()+'';
  const d28=since(isoMinus(27)), d90=since(isoMinus(89)), y12=since(isoMinus(364)), yr=real.filter(f=>f.date.startsWith(y));
  const ym=isoToday().slice(0,7), mo=real.filter(f=>f.date.startsWith(ym)), moName=new Date().toLocaleDateString('tr-TR',{month:'long'});
  const mx=settings.filter(s=>s.kind==='month'&&s.ym===ym).sort((a,b)=>String(a.id).localeCompare(String(b.id))), mxSum=mx.reduce((s,e)=>s+(+e.m||0),0);
  const pf90=d90.filter(f=>f.pf==='SELF').length;
  const a330=d90.filter(f=>/^A330/.test(f.ac)), a350=d90.filter(f=>/^A350/.test(f.ac));
  const pfOf=a=>a.filter(f=>f.pf==='SELF').length;
  const wide=sum(real.filter(f=>isWide(f.ac))), b737=sum(real.filter(f=>isB737(f.ac)));
  const types={};real.forEach(f=>{const k=f.ac||'—';types[k]=types[k]||{n:0,m:0,c:0};types[k].n++;types[k].m+=f.blk||0;if(f.role==='CPT')types[k].c+=f.blk||0});
  const ord=k=>{const i=TYPE_ORDER.indexOf(k);return i<0?(k==='Model X'?999:TYPE_ORDER.length-1.5):i};
  const tRows=Object.entries(types).sort((a,b)=>ord(a[0])-ord(b[0])||b[1].m-a[1].m).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r num">${v.n.toLocaleString('tr-TR')}</td><td class="r num">${hm(v.m)}</td><td class="r num">${hm(v.c)}</td></tr>`).join('');
  const years={};real.forEach(f=>{const k=f.date.slice(0,4);years[k]=years[k]||{n:0,m:0};years[k].n++;years[k].m+=f.blk||0});
  const yRows=Object.entries(years).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>`<tr><td class="num">${k}</td><td class="r num">${v.n}</td><td class="r num">${hm(v.m)}</td></tr>`).join('');
  const last=real[0];
  main.innerHTML=`
  <div class="big"><div class="l">Toplam uçuş süresi</div><div class="v">${hm(tot)}</div><div class="l" style="opacity:.75;text-transform:none;letter-spacing:0">${real.length.toLocaleString('tr-TR')} uçuş${last?' · son uçuş '+trDate(last.date):''}</div></div>
  <div class="grid">
    <div class="tile"><div class="l">Kaptan</div><div class="v">${hm(cpt)}</div></div>
    <div class="tile"><div class="l">F/O</div><div class="v">${hm(fo)}</div></div>
    <div class="tile"><div class="l">A330/350 uçuş saati</div><div class="v">${hm(wide)}</div></div>
    <div class="tile"><div class="l">B737 uçuş saati</div><div class="v">${hm(b737)}</div></div>
  </div>
  <h2>Limitler ve güncellik</h2>
  <div class="grid">
    <div class="tile mtile"><div><div class="l">${esc(moName)} ayı</div><div class="v">${hm(sum(mo)+mxSum)}</div><div class="s">${mo.length} uçuş${mxSum?' · elle '+hm(mxSum):''}</div></div>
      <div class="mright">${mx.length?`<div class="mxl">${mx.map(e=>`<span class="mx"><b class="num">${hm(e.m)}</b><small>${esc(e.t)}</small><button type="button" data-id="${esc(e.id)}" aria-label="Sil">×</button></span>`).join('')}</div>`:''}
        <div class="mxadd"><input id="mxIn" placeholder="0:00" inputmode="decimal" autocomplete="off" aria-label="Süre"><div class="seg mxseg"><button type="button" data-t="pas">Pas</button><button type="button" data-t="sim">Sim</button></div><button type="button" class="btn" id="mxAdd">Ekle</button></div></div></div>
    <div class="tile"><div class="l">Son 28 gün</div><div class="v">${hm(sum(d28))}</div><div class="s">${d28.length} uçuş</div></div>
    <div class="tile"><div class="l">Son 12 ay</div><div class="v">${hm(sum(y12))}</div><div class="s">${y12.length} uçuş</div></div>
    <div class="tile"><div class="l">${y} yılı</div><div class="v">${hm(sum(yr))}</div><div class="s">${yr.length} uçuş</div></div>

  </div>
  <h2>Uçak tiplerine göre</h2>
  <div style="overflow-x:auto"><table><tr><th>Tip</th><th class="r">Uçuş</th><th class="r">Süre</th><th class="r">Kaptan</th></tr>${tRows}</table></div>

/* Cockpit rehber dosyası: var data=[{i:'sicil',n:'AD',p:'+90…',u:'rütbe'},…]; var img={"sicil":"base64",…} */
const sic0=s=>String(s||'').replace(/\D/g,'').replace(/^0+/,'');
async function importCockpit(file){
  const txt=await file.text();
  const di=txt.indexOf('var data=');if(di<0)throw new Error('Bu dosya Cockpit rehberine benzemiyor');
  const re=/\{i:\s*'([^']*)',n:'([^']*)',e:'([^']*)',p:'([^']*)',u:'([^']*)'\}/g;re.lastIndex=di;
  const recs=[];let m;while((m=re.exec(txt)))recs.push({s:sic0(m[1]),raw:m[1],name:m[2],p:m[4]});
  if(!recs.length)throw new Error('Rehberde kişi bulunamadı');
  let img={};const ii=txt.indexOf('var img=');if(ii>=0){const end=txt.indexOf('}',ii);try{img=JSON.parse(txt.slice(ii+8,end+1))}catch{img={}}}
  const bySic=new Map(recs.map(r=>[r.s,r])), byName=new Map();recs.forEach(r=>{const k=fold(r.name);byName.set(k,(byName.get(k)||[]).concat(r))});
  let updated=0,photos=0,tels=0,ambiguous=0,missing=0;
  for(const p of pilots){
    const isSelf=fold(p.name)==='self';
    let r=p.sicil&&bySic.get(sic0(p.sicil));
    if(isSelf&&!r)continue;
    if(!r&&p.sicil){missing++;continue} /* sicili olan kayıt sadece sicilden eşleşir (aynı isimli farklı kişiler) */
    if(!r){const c=byName.get(fold(p.name))||[];if(c.length===1)r=c[0];else{if(c.length>1)ambiguous++;else missing++;continue}}
    let ch=false;const b=img[r.raw];
    if(b&&b.length>100){const ph=(b.startsWith('iVBOR')?'data:image/png;base64,':'data:image/jpeg;base64,')+b;if(p.photo!==ph){p.photo=ph;photos++;ch=true}}
    if(/^\+\d{6,}$/.test(r.p)&&p.tel!==r.p){p.tel=r.p;tels++;ch=true}
    if(!p.sicil&&r.s){p.sicil=r.s;ch=true}
    if(ch){mark('p',p.id,p);updated++}}
  await save();fillLists();
  return {updated,photos,tels,ambiguous,missing}}

let planeQuery='',planeShown=80;
function planeList(){
  const m=new Map();
  for(const f of flights){if(f.sim||!f.reg||/^Z+$/.test(f.reg)||/notail/i.test(f.reg))continue;
    const e=m.get(f.reg)||{reg:f.reg,ac:'',n:0,last:'',m:0};e.n++;e.m+=f.blk||0;if(f.date>=e.last){e.last=f.date;e.ac=f.ac||e.ac}m.set(f.reg,e)}
  for(const p of planes)if(!m.has(p.id))m.set(p.id,{reg:p.id,ac:p.ac||'',n:0,last:'',m:0});
  const notes=new Map(planes.map(p=>[p.id,p.note||'']));
  return [...m.values()].map(e=>({...e,note:notes.get(e.reg)||''})).sort((a,b)=>b.last.localeCompare(a.last)||a.reg.localeCompare(b.reg))}

    const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const rows=[...flights].reverse().map(f=>cols.map(([k])=>cell(k==='date'?trDate(f.date):k==='simt'?(f.sim?hm(f.simt):''):k==='blk'?hm(f.blk):k==='pf'?(f.pf||''):k==='role'?(f.role==='CPT'?'Kaptan':'F/O'):f[k])).join(';'));
    download(`logbook-${isoToday()}.csv`,'﻿'+[cols.map(c=>cell(c[1])).join(';'),...rows].join('\r\n'),'text/csv')};
}

/* ---------- Başlat ---------- */
(async()=>{
  try{navigator.storage?.persist?.()}catch{}
  await load();fillLists();
  const code=location.hash.startsWith('#kurulum=')?location.hash.slice(1):null;
  history.replaceState({v:'list'},'',location.pathname+location.search);render();setSync(sync?'ok':'off');
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  $('#sync').onclick=async()=>{const r=await runSync();if(r.ok)toast(r.got||r.sent?`${r.got} kayıt alındı, ${r.sent} gönderildi`:'Her şey güncel');else if(r.error)toast(r.error)};
  window.addEventListener('online',()=>runSync());
  window.addEventListener('offline',()=>{if(sync&&!syncing)setSync('offline')});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&sync&&(pendCount()||Date.now()-(sync.last||0)>60000))runSync()});
  setInterval(()=>{if(document.visibilityState==='visible')runSync()},300000);
  window.addEventListener('hashchange',async()=>{if(!location.hash.startsWith('#kurulum='))return;const c=location.hash.slice(1);history.replaceState(history.state,'',location.pathname+location.search);
    if(sync){toast('Bu cihaz zaten bağlı');return}await connect(c);if(view==='settings')renderSettings()});
  if(code&&!sync)await connect(code);else if(sync)runSync();else if(await runFixes())render();
})();
</script>
</body>
